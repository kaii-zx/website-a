<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Selamat Ulang Tahun, [Nama Penerima]!</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      font-family: 'Segoe UI', 'Quicksand', 'Comic Sans MS', cursive, sans-serif;
      background: linear-gradient(135deg, #ffe0ec 0%, #c2e9fb 100%);
      overflow-x: hidden;
    }
    #page1 {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 0.7s;
    }
    #page1 h1 {
      font-size: 2.7rem;
      color: #e75480;
      text-shadow: 2px 2px 8px #fff6;
      margin-bottom: 2rem;
      letter-spacing: 1px;
    }
    #page1 button {
      padding: 1rem 2.5rem;
      font-size: 1.2rem;
      background: linear-gradient(90deg, #ffb6b9, #fcdff0);
      border: none;
      border-radius: 30px;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 16px #e7548033;
      transition: background 0.3s, transform 0.2s;
    }
    #page1 button:hover {
      background: linear-gradient(90deg, #fcdff0, #ffb6b9);
      transform: scale(1.05);
    }
    #page2 {
      min-height: 100vh;
      width: 100vw;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      background: transparent;
      opacity: 0;
      animation: fadeInPage 1.2s forwards;
      overflow: hidden;
    }
    @keyframes fadeInPage {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    .surprise-message {
      margin-top: 5vh;
      background: rgba(255,255,255,0.85);
      border-radius: 24px;
      padding: 2.5rem 2rem 2rem 2rem;
      box-shadow: 0 8px 32px #e7548033;
      max-width: 480px;
      text-align: center;
      position: relative;
      z-index: 2;
      animation: slideUpFade 1.2s 0.5s both;
    }
    @keyframes slideUpFade {
      from { opacity: 0; transform: translateY(60px);}
      to { opacity: 1; transform: translateY(0);}
    }
    .surprise-message h2 {
      font-size: 2.1rem;
      color: #e75480;
      margin-bottom: 1.2rem;
      animation: heartBeat 1.5s 1;
    }
    .surprise-message p {
      font-size: 1.15rem;
      color: #444;
      line-height: 1.7;
      margin-bottom: 1.5rem;
      animation: fadeInText 1.5s 1.1s both;
    }
    @keyframes fadeInText {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    .confetti {
      pointer-events: none;
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      z-index: 1;
      overflow: hidden;
    }
    .confetti-piece {
      position: absolute;
      width: 12px; height: 18px;
      border-radius: 3px;
      opacity: 0.85;
      animation: confettiFall linear infinite;
    }
    @keyframes confettiFall {
      0% { transform: translateY(-30px) rotateZ(0deg);}
      100% { transform: translateY(110vh) rotateZ(360deg);}
    }
    .heart-icon {
      width: 54px;
      height: 48px;
      position: absolute;
      left: 18px;
      top: 18px;
      z-index: 3;
      animation: heartBeat 1.2s infinite;
      display: flex;
      align-items: center;
      justify-content: center;
      /* Remove SVG default */
    }
    .heart-shape {
      width: 38px;
      height: 34px;
      position: relative;
      display: inline-block;
    }
    .heart-shape::before,
    .heart-shape::after {
      content: "";
      position: absolute;
      left: 18px;
      top: 0;
      width: 18px;
      height: 28px;
      background: #e75480;
      border-radius: 18px 18px 0 0;
      transform: rotate(-45deg);
      box-shadow: 0 2px 8px #e7548033;
    }
    .heart-shape::after {
      left: 0;
      transform: rotate(45deg);
    }
    .cake-icon {
      width: 54px;
      height: 54px;
      position: absolute;
      right: 18px;
      top: 18px;
      z-index: 3;
      animation: cakeBounce 1.5s infinite;
    }
    @keyframes cakeBounce {
      0%, 100% { transform: translateY(0);}
      50% { transform: translateY(-12px);}
    }
    .cake-base {
      width: 38px;
      height: 22px;
      background: #ffe0b2;
      border-radius: 0 0 12px 12px;
      position: absolute;
      bottom: 0;
      left: 8px;
      box-shadow: 0 2px 8px #e7548033;
    }
    .cake-icing {
      width: 38px;
      height: 10px;
      background: #e75480;
      border-radius: 12px 12px 8px 8px;
      position: absolute;
      top: 0;
      left: 8px;
    }
    .cake-candle {
      width: 4px;
      height: 14px;
      background: #fff;
      position: absolute;
      left: 24px;
      top: -12px;
      border-radius: 2px;
    }
    .cake-flame {
      width: 8px;
      height: 8px;
      background: radial-gradient(circle at 60% 40%, #ffd700 70%, #ff9800 100%);
      border-radius: 50%;
      position: absolute;
      left: 22px;
      top: -16px;
      animation: flameFlicker 0.7s infinite alternate;
    }
    @keyframes flameFlicker {
      0% { transform: scale(1) translateY(0);}
      100% { transform: scale(1.15) translateY(-2px);}
    }

    /* Custom Modal */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.18);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.3s;
    }
    .modal-box {
      background: #fff;
      border-radius: 18px;
      box-shadow: 0 8px 32px #e7548033;
      padding: 2rem 1.5rem 1.5rem 1.5rem;
      min-width: 270px;
      max-width: 90vw;
      text-align: center;
      position: absolute;
      animation: fadeInModal 0.3s;
    }
    @keyframes fadeInModal {
      from { opacity: 0; transform: scale(0.85);}
      to { opacity: 1; transform: scale(1);}
    }
    .modal-box h3 {
      margin: 0 0 1rem 0;
      color: #e75480;
      font-size: 1.3rem;
    }
    .modal-box input[type="password"] {
      padding: 0.7rem 1rem;
      border-radius: 8px;
      border: 1px solid #e75480;
      font-size: 1.1rem;
      margin-bottom: 1.2rem;
      width: 90%;
      outline: none;
      transition: border 0.2s;
    }
    .modal-box input[type="password"]:focus {
      border: 2px solid #e75480;
    }
    .modal-box button {
      padding: 0.6rem 1.5rem;
      background: linear-gradient(90deg, #ffb6b9, #fcdff0);
      border: none;
      border-radius: 20px;
      color: #fff;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 0.5rem;
      transition: background 0.3s, transform 0.2s;
    }
    .modal-box button:hover {
      background: linear-gradient(90deg, #fcdff0, #ffb6b9);
      transform: scale(1.05);
    }
    .modal-box .modal-error {
      color: #e75480;
      font-size: 0.98rem;
      margin-bottom: 0.7rem;
      min-height: 1.2em;
    }
    /* Konfirmasi Modal */
    .modal-confirm-msg {
      font-size: 1.1rem;
      color: #444;
      margin-bottom: 1.2rem;
    }
    .modal-box .modal-ok-btn {
      margin-top: 0.5rem;
    }

    /* Cursor follower heart effect */
    .cursor-heart {
      position: fixed;
      pointer-events: none;
      z-index: 9999;
      will-change: transform, opacity;
      opacity: 0.85;
      animation: heartFadeMove 1.1s forwards;
    }
    @keyframes heartFadeMove {
      0% {
        opacity: 0.85;
        transform: scale(1) translateY(0);
      }
      70% {
        opacity: 0.6;
        transform: scale(1.15) translateY(-12px);
      }
      100% {
        opacity: 0;
        transform: scale(0.7) translateY(-28px);
      }
    }
    .cursor-heart-shape {
      width: 22px;
      height: 20px;
      position: relative;
      display: inline-block;
    }
    .cursor-heart-shape::before,
    .cursor-heart-shape::after {
      content: "";
      position: absolute;
      left: 11px;
      top: 0;
      width: 11px;
      height: 16px;
      background: radial-gradient(circle at 60% 40%, #ffb6d5 60%, #e75480 100%);
      border-radius: 11px 11px 0 0;
      transform: rotate(-45deg);
      box-shadow: 0 1px 6px #e7548033;
    }
    .cursor-heart-shape::after {
      left: 0;
      transform: rotate(45deg);
    }

    /* Hide default cursor for effect */
    body {
      cursor: none;
    }
  </style>
</head>
<body>
  <!-- Halaman 1 -->
  <div id="page1">
    <h1>Selamat Ulang Tahun, <span id="nama-penerima">[Nama Penerima]</span>! ❤️</h1>
    <button id="lanjut-btn">Klik untuk Lanjut</button>
  </div>
  <!-- Halaman 2 -->
  <div id="page2">
    <!-- Konfeti -->
    <div class="confetti" id="confetti-container"></div>
    <!-- Ikon hati -->
    <div class="heart-icon">
      <div class="heart-shape"></div>
    </div>
    <!-- Ikon kue ulang tahun -->
    <div class="cake-icon">
      <div class="cake-base"></div>
      <div class="cake-icing"></div>
      <div class="cake-candle"></div>
      <div class="cake-flame"></div>
    </div>
    <!-- Pesan panjang -->
    <div class="surprise-message">
      <h2>Untuk Kamu yang Paling Spesial...</h2>
      <p id="pesan-panjang">[Pesan Panjang di sini...]</p>
    </div>
  </div>
  <!-- Modal Custom -->
  <div id="modal-root"></div>
  <script>
    // ==============================
    // Konfigurasi Placeholder
    // ==============================
    const NAMA_PENERIMA = "Aaa";
    const PASSWORD_RAHASIA = "KALEM";
    const PESAN_PANJANG = `[Pesan Panjang di sini...]`;

    document.getElementById('nama-penerima').textContent = NAMA_PENERIMA;

    // ==============================
    // Modal Utility
    // ==============================
    function showModalBox({html, onClose, randomPos}) {
      // Remove existing modal
      let old = document.getElementById('modal-overlay');
      if (old) old.remove();

      // Overlay
      const overlay = document.createElement('div');
      overlay.className = 'modal-overlay';
      overlay.id = 'modal-overlay';

      // Modal box
      const box = document.createElement('div');
      box.className = 'modal-box';
      box.innerHTML = html;

      // Random position (for konfirmasi)
      if (randomPos) {
        // Window size
        const vw = Math.max(document.documentElement.clientWidth, window.innerWidth || 0);
        const vh = Math.max(document.documentElement.clientHeight, window.innerHeight || 0);
        // Modal size
        box.style.position = 'absolute';
        const boxW = 320, boxH = 160;
        let left = Math.random() * (vw - boxW - 40) + 20;
        let top = Math.random() * (vh - boxH - 40) + 20;
        box.style.left = left + 'px';
        box.style.top = top + 'px';
      }

      overlay.appendChild(box);
      document.body.appendChild(overlay);

      // Close handler
      overlay.onclick = function(e) {
        if (e.target === overlay && onClose) onClose();
      };
      return box;
    }
    function closeModalBox() {
      let old = document.getElementById('modal-overlay');
      if (old) old.remove();
    }

    // ==============================
    // Event Tombol "Klik untuk Lanjut"
    // ==============================
    document.getElementById('lanjut-btn').addEventListener('click', function() {
      showPasswordModal();
    });

    // ==============================
    // Custom Password Modal
    // ==============================
    function showPasswordModal() {
      let errorMsg = '';
      function render() {
        const html = `
          <h3>Masukkan Kata Sandi Rahasia</h3>
          <div class="modal-error">${errorMsg}</div>
          <input type="password" id="modal-password-input" placeholder="Kata sandi..." autocomplete="off" />
          <br>
          <button id="modal-password-btn">Lanjut</button>
        `;
        const box = showModalBox({html, onClose: null});
        setTimeout(() => {
          document.getElementById('modal-password-input').focus();
        }, 100);

        document.getElementById('modal-password-btn').onclick = function() {
          const val = document.getElementById('modal-password-input').value;
          if (val !== PASSWORD_RAHASIA) {
            errorMsg = "Kata sandi salah! Coba lagi ya.";
            render();
          } else {
            closeModalBox();
            konfirmasiSembilanKali();
          }
        };
        document.getElementById('modal-password-input').onkeydown = function(e) {
          if (e.key === "Enter") document.getElementById('modal-password-btn').click();
        };
      }
      render();
    }

    // ==============================
    // Loop Konfirmasi 9 Kali (Custom Modal)
    // ==============================
    function konfirmasiSembilanKali() {
      // Daftar pesan lucu tambahan
      const pesanLucu = [
        "Hmm... yakin banget nih? 😏",
        "Jangan-jangan cuma nebak ya? 🤔",
        "Waduh, semangat lah yaa 😆"
      ];
      let idx = 1;
      function nextKonfirmasi() {
        let msg;
        // Tambahkan pesan khusus di percobaan ke-2, ke-4, dan ke-6
        if (idx === 2) {
          msg = pesanLucu[0];
        } else if (idx === 4) {
          msg = pesanLucu[1];
        } else if (idx === 6) {
          msg = pesanLucu[2];
        } else if (idx <= 8) {
          msg = `Beneran yakin ini kata sandinya? `;
        } else {
          msg = "Oke, oke, kata sandinya BENAR! Siap-siap ya...";
        }

        if (idx <= 8) {
          showKonfirmasiModal(msg, () => {
            idx++;
            nextKonfirmasi();
          });
        } else {
          showKonfirmasiModal(msg, tampilkanHalaman2);
        }
      }
      nextKonfirmasi();
    }

    // ==============================
    // Custom Konfirmasi Modal (Random Position)
    // ==============================
    function showKonfirmasiModal(msg, onOk) {
      const html = `
        <div class="modal-confirm-msg">${msg}</div>
        <button class="modal-ok-btn" id="modal-ok-btn">OK</button>
      `;
      const box = showModalBox({html, onClose: null, randomPos: true});
      document.getElementById('modal-ok-btn').onclick = function() {
        closeModalBox();
        if (onOk) onOk();
      };
    }

    // ==============================
    // Transisi ke Halaman 2
    // ==============================
    function tampilkanHalaman2() {
      document.getElementById('page1').style.display = 'none';
      document.getElementById('pesan-panjang').textContent = PESAN_PANJANG;
      const page2 = document.getElementById('page2');
      page2.style.display = 'flex';
      setTimeout(() => {
        page2.style.opacity = '1';
      }, 50);
      mulaiKonfeti();
    }

    // ==============================
    // Animasi Konfeti
    // ==============================
    function mulaiKonfeti() {
      const confettiColors = [
        "#e75480", "#ffb6b9", "#fcdff0", "#c2e9fb", "#ffe0b2", "#f7cac9", "#b5ead7", "#ffdac1"
      ];
      const confettiContainer = document.getElementById('confetti-container');
      const confettiCount = 36;
      confettiContainer.innerHTML = '';
      for (let i = 0; i < confettiCount; i++) {
        const confetti = document.createElement('div');
        confetti.className = 'confetti-piece';
        confetti.style.background = confettiColors[Math.floor(Math.random() * confettiColors.length)];
        confetti.style.left = Math.random() * 100 + 'vw';
        confetti.style.animationDuration = (2.5 + Math.random() * 2.5) + 's';
        confetti.style.animationDelay = (Math.random() * 2) + 's';
        confetti.style.transform = `rotate(${Math.random()*360}deg)`;
        confettiContainer.appendChild(confetti);
      }
      setInterval(() => {
        for (let i = 0; i < confettiCount/3; i++) {
          const confetti = document.createElement('div');
          confetti.className = 'confetti-piece';
          confetti.style.background = confettiColors[Math.floor(Math.random() * confettiColors.length)];
          confetti.style.left = Math.random() * 100 + 'vw';
          confetti.style.animationDuration = (2.5 + Math.random() * 2.5) + 's';
          confetti.style.animationDelay = '0s';
          confetti.style.transform = `rotate(${Math.random()*360}deg)`;
          confettiContainer.appendChild(confetti);
          setTimeout(() => confetti.remove(), 5000);
        }
      }, 1200);
    }
    // ==============================
    // Cursor Follower Heart Effect
    // ==============================
    (function() {
      // Shades of pink for variety
      const heartColors = [
        "radial-gradient(circle at 60% 40%, #ffb6d5 60%, #e75480 100%)",
        "radial-gradient(circle at 60% 40%, #ff69b4 60%, #e75480 100%)",
        "radial-gradient(circle at 60% 40%, #fcdff0 60%, #ffb6b9 100%)",
        "radial-gradient(circle at 60% 40%, #ffb6b9 60%, #e75480 100%)"
      ];
      document.addEventListener('mousemove', function(e) {
        // Create heart element
        const heart = document.createElement('div');
        heart.className = 'cursor-heart';
        // Random size for dreamy effect
        const size = 16 + Math.random() * 16;
        heart.style.width = size + 'px';
        heart.style.height = size + 'px';
        heart.style.left = (e.clientX - size/2) + 'px';
        heart.style.top = (e.clientY - size/2) + 'px';
        heart.style.opacity = 0.85 + Math.random()*0.1;
        // Random color
        const color = heartColors[Math.floor(Math.random()*heartColors.length)];
        // Heart shape
        heart.innerHTML = `<div class="cursor-heart-shape"></div>`;
        heart.firstChild.style.width = size + 'px';
        heart.firstChild.style.height = size + 'px';
        // Set color
        heart.firstChild.style.setProperty('--heart-color', color);
        // Override background for both pseudo elements
        const style = document.createElement('style');
        style.innerHTML = `
          .cursor-heart[data-uid="${Date.now()}"] .cursor-heart-shape::before,
          .cursor-heart[data-uid="${Date.now()}"] .cursor-heart-shape::after {
            background: ${color} !important;
          }
        `;
        // Assign unique id for style
        const uid = Date.now() + Math.floor(Math.random()*10000);
        heart.setAttribute('data-uid', uid);
        style.innerHTML = style.innerHTML.replaceAll(Date.now(), uid);
        document.head.appendChild(style);
        setTimeout(()=>style.remove(), 1200);

        document.body.appendChild(heart);
        setTimeout(() => {
          heart.remove();
        }, 1100);
      });
    })();

    // ==============================
    // Catatan:
    // - Ganti [Nama Penerima], [PasswordRahasia], dan [Pesan Panjang] sesuai kebutuhan.
    // - Semua logika utama sudah diberi komentar.
    // ==============================
  </script>
</body>
</html>
